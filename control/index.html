<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe4"><title>Control • Buddhist Live</title><link rel="stylesheet" href="./control.css"></head><body>
<div id="lock"><form id="pinForm"><div class="seal">☸</div><h1>ผู้ควบคุมการถ่ายทอด</h1><p>กรุณาใส่รหัส PIN เพื่อดำเนินการต่อ</p><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••"><button>เข้าสู่ Control Panel</button><small id="pinError"></small></form></div>
<header><div><p>BUDDHIST LIVE</p><h1>ห้องสวดมนต์</h1></div><span id="connection">● กำลังเชื่อมต่อ</span></header><main>
<section class="hero"><div><small>ผู้ร่วมสวดในฉาก</small><strong><span id="charCount">1</span><i>/ 20</i></strong></div><div class="progress"><span id="progress"></span></div><p><b id="likes">0</b> LIKES · คนถัดไปที่ <span id="next">50</span></p><button data-cmd="likes" data-value="10">♡ เพิ่ม 10 Likes</button></section>
<section><h2><span>01</span> เสียงและบทสวด</h2><label class="upload">＋ เลือกไฟล์เสียง MP3<input id="audioUpload" type="file" accept="audio/mpeg,audio/mp3"></label><div class="transport"><button data-cmd="audio" data-value="playing">▶</button><button data-cmd="audio" data-value="paused">Ⅱ</button><button data-cmd="audio" data-value="stopped">■</button></div><label>ตำแหน่งเสียง <output id="time">0:00</output><input id="seek" type="range" min="0" max="600" value="0"></label><label>ระดับเสียง <output id="volumeOut">75%</output><input id="volume" type="range" min="0" max="1" step=".05" value=".75"></label></section>
<section><h2><span>02</span> บรรยากาศ</h2><h3>ฉาก</h3><div class="grid scenes"><button data-cmd="scene" data-value="temple">⛩<b>วิหาร</b></button><button data-cmd="scene" data-value="forest">♧<b>ป่าไผ่</b></button><button data-cmd="scene" data-value="night">☾<b>ราตรี</b></button><button data-cmd="scene" data-value="lotus">♨<b>โถงบัว</b></button></div><h3>มุมกล้อง</h3><div class="chips"><button data-cmd="auto">AUTO</button><button data-cmd="camera" data-value="wide">Wide</button><button data-cmd="camera" data-value="center">Center</button><button data-cmd="camera" data-value="left">Left</button><button data-cmd="camera" data-value="right">Right</button><button data-cmd="camera" data-value="focus">Focus</button><button data-cmd="camera" data-value="top">Top</button></div></section>
<section><h2><span>03</span> คำบรรยาย</h2><div class="row"><button data-cmd="subtitle-toggle">เปิด / ปิด</button><div class="chips"><button data-cmd="language" data-value="th">ไทย</button><button data-cmd="language" data-value="en">English</button><button data-cmd="language" data-value="pi">Pāli</button></div></div></section>
<section><h2><span>04</span> ควบคุมผู้ร่วมสวด</h2><div class="two"><button data-cmd="character" data-value="add">＋ เพิ่มตัวละคร</button><button data-cmd="character" data-value="remove">− นำออก</button></div><div class="chips"><button data-cmd="action" data-value="bow">ก้มกราบ</button><button data-cmd="action" data-value="meditate">นั่งสมาธิ</button><button data-cmd="action" data-value="pray">พนมมือ</button><button data-cmd="action" data-value="idle">พัก</button></div><h3>ทดสอบของขวัญ</h3><div class="gifts"><button data-gift="lotus">🪷<small>ดอกบัว</small></button><button data-gift="candle">🕯️<small>เทียน</small></button><button data-gift="golden">✨<small>บัวทอง</small></button><button data-gift="aura">☀️<small>ออร่า</small></button><button data-gift="bell">🔔<small>ระฆัง</small></button></div></section>
<button id="reset">รีเซ็ต Session</button></main><script src="/config.js"></script><script type="module" src="./control.js"></script></body></html>
